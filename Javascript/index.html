<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>IT Service Desk</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

    <div class="container">

        <h1>IT Service Desk - Ticket Management Portal</h1>

        <div class="counter-box">
            <div>Total Tickets: <span id="totalTickets">0</span></div>
            <div>Open Tickets: <span id="openTickets">0</span></div>
            <div>Resolved Tickets: <span id="resolvedTickets">0</span></div>
        </div>

        <div class="form-section">
            <h2>Raise Ticket</h2>

            <input
                type="text"
                id="employeeName"
                placeholder="Employee Name">

            <select id="category">
                <option value="">Select Category</option>
                <option>Laptop</option>
                <option>Desktop</option>
                <option>VPN</option>
                <option>Network</option>
                <option>Printer</option>
                <option>Software Installation</option>
                <option>Email</option>
                <option>Password Reset</option>
                <option>Other</option>
            </select>

            <select id="priority">
                <option value="">Select Priority</option>
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
                <option>Critical</option>
            </select>

            <textarea
                id="description"
                placeholder="Issue Description"></textarea>

            <button id="submitBtn">Submit Ticket</button>

            <p id="message"></p>
        </div>

        <div class="ticket-section">
            <h2>Active Tickets</h2>

            <div id="ticketContainer"></div>
        </div>
    </div>

    <script src="script.js"></script>

    </body>
</html>
